<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="نیم بها کننده لینک و نیم بها کننده دانلود">
    <title>نیم بها کننده لینک آدرس دانلود</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <!-- Styles -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="assets/icons/remixicon.css" />
  </head>

  <body>
    <!-- Header -->
    <header id="header" class="header">

      <!-- Header Container -->
      <div class="header__container">

        <!-- Brand -->
        <div class="header__brand">
          <a href="index.html" id="headerLogo" class="header__logo"></a>
        </div>

        <!-- Actions -->
        <div class="header__actions">

          <!-- Hamburger -->
          <button
            type="button"
            id="hamburger"
            class="header__hamburger"
            aria-label="باز کردن منو"
            aria-expanded="false"
            aria-controls="header-navigation"
          >
            <i class="ri-menu-line"></i>
          </button>

          <!-- Navigation -->
          <nav
            id="headerNavigation"
            class="header__navigation"
            aria-label="منوی اصلی"
          >

            <!-- Menu Header -->
            <div class="header__menu-header">
              <h2 class="header__menu-title">آدرس دانلود</h2>

              <button
                type="button"
                id="headerClose"
                class="header__menu-close"
                aria-label="بستن منو"
              >
                <i class="ri-close-line"></i>
              </button>
            </div>

            <!-- Menu -->
            <ul id="headerMenu" class="header__menu"></ul>
          </nav>

        </div>
      </div>
    </header>
    <!-- Footer -->
     <footer id="footer" class="footer">
        <!-- Footer Container -->
        <div class="footer__container">
            <!-- Copyright -->
            <p class="footer__copyright">© 2026 آدرس دانلود. تمام حقوق محفوظ می باشد.</p>
            <!-- Credit -->
            <p class="footer__credit">طراح قالب <a class="footer__credit-link" href="#">نیما حسین زاده</a></p>
        </div>
     </footer>
  </body>
  <script src="js/main.js"></script>
</html>
